[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pybbn-assurance"
version = "0.2.0"
description = "PyBBN Assurance Case - Bayesian Belief Network assurance case toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pybbn>=0.3",
    "networkx>=3.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.29", "httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/pybbn_assurance --cov-report=term-missing"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["F841"]  # pre-existing unused local variables (deferred cleanup)

[tool.black]
line-length = 100
target-version = ["py311"]
